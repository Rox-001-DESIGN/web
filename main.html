<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Sweetheart</title>
    <style>
        body {
            background-color: #f8e1e1;
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #4a4a4a;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ff6f61;
            color: white;
            padding: 20px;
        }
        h1 {
            font-size: 3em;
            margin: 0;
        }
        p {
            font-size: 1.2em;
            margin-top: 20px;
        }
        .message {
            font-size: 1.5em;
            font-weight: bold;
            color: #ff6f61;
            margin: 20px 0;
        }
        .heart {
            font-size: 2em;
            color: #ff4081;
        }
        .button {
            background-color: #ff6f61;
            color: white;
            padding: 15px 25px;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            text-decoration: none;
        }
        .button:hover {
            background-color: #ff3b2e;
        }
        .photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>For My Sweetheart 💖</h1>
</header>

<p class="message">You are the love of my life, and I made this little corner of the internet just for you!</p>

<img src="/my photo.png" alt="Your Photo" class="photo">

<p class="message">I love every moment I get to spend with you, and I'm so lucky to have you by my side.</p>

<a href="https://www.your-favorite-link.com" class="button">My Heart to You 💌</a>

<p class="heart">❤️ Always and forever. ❤️</p>

</body>
</html>
